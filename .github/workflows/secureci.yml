# Post-release smoke test: run the SecureCI action against this repo's
# workflows with the latest @secureci/cli release from npm. Started from
# `secureci init workflow`, then changed for this repo (see below).
#
# Not a PR check: ci.yaml already runs the CLI built from each PR
# (`run --dry-run`, which validates). This runs after CI on main, where
# the publish job releases a new version, and can be run by hand.
name: SecureCI

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secureci:
    # Only after a successful CI run for a push to main (or a manual run).
    # `branches: [main]` alone would also match a fork's PR from a branch
    # named main. workflow_run checks out this repo's default branch, not
    # the triggering run's code, so nothing untrusted is checked out.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    # The SARIF upload needs code scanning enabled for this repository
    # (Settings > Code security; on private repositories this needs
    # GitHub Code Security / Advanced Security). Without it the upload
    # step fails: enable it, or give the secure-ci/cli step
    # `with: upload-sarif: false` (and drop the two scopes below).
    permissions:
      contents: read
      actions: read # upload-sarif reads the workflow run
      security-events: write # upload SARIF to code scanning
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Deliberately unpinned, unlike what `secureci init workflow`
      # generates: the action comes from this checkout of main (`./`) and
      # the CLI from npm's `latest` dist-tag, so this always exercises the
      # current release. Other repos should keep the pinned refs.
      - uses: ./
        with:
          version: latest
